name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:        # 允许在网页手动触发，改一行字也能重新出包

# Release 发布需要写权限；使用 CI 自动注入的 GITHUB_TOKEN，不依赖任何手工 PAT
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest   # 镜像预装 Android SDK，ANDROID_HOME 已设
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'  # AGP 8.5.2 强制要求 JDK 17

      # 本机无法获取 gradle-wrapper.jar，故不提交 wrapper，
      # 改由官方 action 注入指定版本 Gradle，命令中直接使用 gradle 而非 ./gradlew
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 持久化 debug 签名密钥：GitHub 每次构建都是全新虚拟机，
      # 若不缓存 ~/.android，debug.keystore 每次重新生成，
      # 手机端会因签名不一致拒绝覆盖安装、强制卸载重装（丢全部本地数据）。
      # 固定 key 永不失效，首次生成后所有后续构建复用同一密钥。
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: android-debug-keystore-v1

      - name: Ensure Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error   # 无产物则判失败，避免"看似成功却拿不到包"

      # 同步发布到 Release：公开仓库的 Release 资产可免认证直接下载，
      # 下载不再依赖 PAT（手工 token 会过期/被吊销，已多次造成交付阻塞）
      - name: Publish APK to Release
        run: |
          # 从 build.gradle.kts 提取 versionCode 作为 tag，保证每次出包版本递增
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          TAG="v${VC}"
          gh release create "$TAG" app/build/outputs/apk/debug/*.apk \
            --title "电耗计算 $TAG" \
            --notes "自动构建 $TAG（commit ${{ github.sha }}）" \
            --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
