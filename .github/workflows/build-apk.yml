name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:        # 允许在网页手动触发，改一行字也能重新出包

jobs:
  build:
    runs-on: ubuntu-latest   # 镜像预装 Android SDK，ANDROID_HOME 已设
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'  # AGP 8.5.2 强制要求 JDK 17

      # 本机无法获取 gradle-wrapper.jar，故不提交 wrapper，
      # 改由官方 action 注入指定版本 Gradle，命令中直接使用 gradle 而非 ./gradlew
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 持久化 debug 签名密钥：GitHub 每次构建都是全新虚拟机，
      # 若不缓存 ~/.android，debug.keystore 每次重新生成，
      # 手机端会因签名不一致拒绝覆盖安装、强制卸载重装（丢全部本地数据）。
      # 固定 key 永不失效，首次生成后所有后续构建复用同一密钥。
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: android-debug-keystore-v1

      - name: Ensure Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error   # 无产物则判失败，避免"看似成功却拿不到包"
